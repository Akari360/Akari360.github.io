<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akari360 | Virtual Tour Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Header -->
    <header>
        <div class="container animate-fade-in">
            <div class="logo">AKARI<span>360</span></div>
            <h1>Immersive Virtual Spaces</h1>
            <p>High-resolution, self-hosted interactive 360° tours optimized for web and mobile devices.</p>
        </div>
    </header>

    <!-- Filter & Analytics Controls (Optional expansion room) -->
    <section class="portfolio-controls container">
        <h2>Featured Projects</h2>
        <div class="line-decorator"></div>
    </section>

    <!-- Dynamic Portfolio Grid -->
    <main class="container">
        <div class="gallery" id="portfolio-grid">
            <!-- JavaScript will automatically inject your Pano2VR tour cards here -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Akari360. Built for seamless spatial immersion.</p>
        </div>
    </footer>

    <!-- The Content Engine Script -->
    <script src="script.js"></script>
</body>
</html>
