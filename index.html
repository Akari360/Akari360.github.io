<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akari 360</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container">
            <h1>Immersive 360° Tour Guide</h1>
            <p>Self-hosted, highly custom virtual tours.</p>
        </div>
    </header>

    <!-- Gallery Section -->
    <main class="container">
        <section class="gallery">
            
            <!-- Self-Hosted Pano2VR Tour Card -->
            <div class="card">
                <div class="iframe-container">
                    <!-- Points directly to your subfolder's Pano2VR index.html -->
                    <iframe src="/0001/output/index.html" allowfullscreen allow="xr-spatial-tracking; gyroscope; accelerometer"></iframe>
                </div>
                <div class="card-info">
                    <h3>Historic Downtown Exploration</h3>
                    <p>A fully interactive, high-resolution tour exported straight out of Pano2VR and hosted completely free.</p>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 360 Tour Guide. Built to capture every angle.</p>
    </footer>

</body>
</html>
