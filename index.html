<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akari360 | Virtual Tour Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Header -->
    <header>
        <div class="container animate-fade-in">
            <!-- Fixed: Swapped text out for the image element with correct class lock -->
            <div class="logo-container">
                <img src="logo.png" alt="Akari Logo" class="site-logo">
            </div>
            <h1>Luxury Homes, Fully Immersive</h1>
            <p>Step into exceptional properties from anywhere in the world.</p>
        </div>
    </header>

    <!-- Filter & Portfolio Controls Bar -->
    <section class="portfolio-controls container">
        <div class="portfolio-heading-wrapper">
            <h2>Featured Projects</h2>
            <div class="line-decorator"></div>
        </div>
        
        <!-- Fixed: Injected the button element exactly where the CSS maps it to the right margin -->
        <button class="btn-open-search" id="open-filter-btn">
            FILTER ARCHIVE PARAMETERS
        </button>
    </section>

    <!-- Dynamic Portfolio Grid -->
    <main class="container">
        <div class="gallery" id="portfolio-grid">
            <!-- JavaScript will automatically inject your Pano2VR tour cards here -->
        </div>
        <div class="hidden-search-msg" id="no-results-msg">No properties match your active filter settings.</div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Akari360. Built for seamless spatial immersion.</p>
        </div>
    </footer>

    <!-- The Content Engine Script -->
    <script src="script.js"></script>
</body>
</html>
