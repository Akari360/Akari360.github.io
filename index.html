<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akari360 | Virtual Tour Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Header -->
    <header>
        <div class="container animate-fade-in">
            <div class="logo-container">
                <img src="logo.png" alt="Akari Logo" class="site-logo">
            </div>
            <h1>Luxury Homes, Fully Immersive</h1>
            <p>Step into exceptional properties from anywhere in the world.</p>
        </div>
    </header>

    <!-- FIXED LAYOUT WRAPPER BAR -->
    <section class="portfolio-controls container">
        <div class="portfolio-heading-wrapper">
            <h2>Featured Projects</h2>
            <div class="line-decorator"></div>
        </div>
        
        <button class="btn-open-search" id="open-filter-btn">
            <span class="search-icon">🔍</span> FILTER ARCHIVE PARAMETERS
        </button>
    </section>

    <!-- Dynamic Portfolio Grid -->
    <main class="container">
        <div class="gallery" id="portfolio-grid">
            <!-- JavaScript injected cards go here -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Akari360. Built for seamless spatial immersion.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
